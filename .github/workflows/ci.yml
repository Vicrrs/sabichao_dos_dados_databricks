# CI: testes em Python 3.11 e 3.12 (como os Databricks Runtimes e o Databricks Apps atuais).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Testes
        run: python -m pytest -q -p no:warnings tests
